<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Mario 68K</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <h1>Super <span>Mario</span> 68K</h1>

  <!-- The canvas is sized from shell.js to match the selected game version,
       so it is already the size the game wants when it starts. -->
  <div class="console">
    <canvas id="canvas" width="240" height="128"></canvas>

    <form class="settings" id="settings">
      <label for="calc">Game version:</label>
      <select id="calc" name="calc">
        <option value="ti92">TI-92+ / Voyage 200</option>
        <option value="ti89">TI-89 / TI-89 Titanium</option>
      </select>

      <label for="lang">Language:</label>
      <!-- Filled in from ma_texts.json by shell.js, so a language added to
           that file is offered here without touching this list. -->
      <select id="lang" name="lang"></select>

      <button type="submit">Start game</button>
    </form>
  </div>

  <dl class="controls">
    <dt>Move</dt>
    <dd><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&rarr;</kbd> <kbd>&darr;</kbd></dd>

    <dt>Jump</dt>
    <dd><kbd>Space</kbd> / <kbd>Z</kbd></dd>

    <dt>Run / fire</dt>
    <dd><kbd>Shift</kbd> / <kbd>X</kbd></dd>

    <dt>Enter / Esc</dt>
    <dd><kbd>Enter</kbd> <kbd>Esc</kbd></dd>
  </dl>

  <footer>
    Original game by Lachprog. Web port by Saladin.<br />
    Source available under GPLv3 on
    <a href="https://github.com/n8pjl/supermario68k">GitHub</a>.
  </footer>

  <script type="module" src="shell.js"></script>
</body>
</html>
